<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atrapar Limones</title>

  <link rel="stylesheet" href="limones.css">
  <script src="Utils.js"></script>
</head>

<body onload="iniciar()">

  <div class="contenedor">

    
<div class="contenedor-logo">
  <img src="logo.png" alt="Logo KrakeDev" class="logo-escuela">
</div>

  <h1>Atrapar Limones</h1>

  <p class="subtitulo">
    ¡Si del cielo te caen limones, atrápalos todos!
  </p>

  <h2 class="autor">Autor: David Llibri </h2>
</header>

<main>

  <section class="zona-juego">

    <div class="titulo-juego">
      <span>🍋</span>
      <strong>¡Cuidado con los limones!</strong>
      <span>🍋</span>
    </div>

    <canvas id="areaJuego" width="600" height="400"></canvas>

  </section>

  <section class="panel">

    <div class="estadistica">
      <span class="emoji">🏆</span>
      <div>
        <small>PUNTAJE</small>
        <strong id="txtPuntaje">0</strong>
      </div>
    </div>

    <div class="estadistica">
      <span class="emoji">❤️</span>
      <div>
        <small>VIDAS</small>
        <strong id="txtVidas">3</strong>
      </div>
    </div>

  </section>

  <div class="botones">

    <button onclick="moverIzquierda()" class="btn btn-movimiento">
      ◀ Izquierda
    </button>

    <button onclick="moverDerecha()" class="btn btn-movimiento">
      Derecha ▶
    </button>

    <button onclick="reiniciar()" class="btn btn-reiniciar">
      ↻ Reiniciar
    </button>



  <p class="instruccion">
    💡 Usa los botones para mover la cesta y atrapar los limones.
  </p>

</main>

<footer>
  <span>🍋</span>
  Atrapar Limones
  <span>🍋</span>
</footer>


  </div>

  <script src="limones.js"></script>

</body>
</html>
